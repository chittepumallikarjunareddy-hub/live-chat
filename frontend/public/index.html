<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="Sivion Technologies · Secure Enterprise Communication Platform" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sivion Chat — Enterprise Communication Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background: #060d18; -webkit-font-smoothing: antialiased; }

    /* ── Animations ──────────────────────────────────── */
    @keyframes scale-in { from { opacity:0; transform:scale(0.94) translateY(4px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes fade-in  { from { opacity:0; } to { opacity:1; } }
    @keyframes slide-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slide-in-right { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:translateX(0); } }
    @keyframes blobFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.05); } }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(0,168,132,0.4); } 70% { box-shadow: 0 0 0 8px rgba(0,168,132,0); } 100% { box-shadow: 0 0 0 0 rgba(0,168,132,0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes messageFade { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes waveBar { 0%, 100% { height: 4px; } 50% { height: 20px; } }

    .animate-scale-in { animation: scale-in 0.2s cubic-bezier(.16,1,.3,1) both; }
    .animate-fade-in  { animation: fade-in 0.25s ease both; }
    .animate-slide-up { animation: slide-up 0.22s cubic-bezier(.16,1,.3,1) both; }
    .animate-slide-in-right { animation: slide-in-right 0.2s cubic-bezier(.16,1,.3,1) both; }
    .sivion-logo-pulse { animation: pulse-ring 2s cubic-bezier(.4,0,.6,1) infinite; }

    /* ── Auth blobs ──────────────────────────────────── */
    .auth-blob { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; opacity:0.12; animation:blobFloat 14s ease-in-out infinite; }
    .auth-blob-1 { width:500px; height:500px; background:#00a884; top:-120px; right:-120px; animation-delay:0s; }
    .auth-blob-2 { width:350px; height:350px; background:#3b82f6; bottom:-100px; left:-100px; animation-delay:5s; }
    .auth-blob-3 { width:250px; height:250px; background:#8b5cf6; top:45%; left:45%; animation-delay:10s; }

    /* ── Scrollbars ──────────────────────────────────── */
    .sivion-scroll::-webkit-scrollbar { width: 3px; }
    .sivion-scroll::-webkit-scrollbar-track { background: transparent; }
    .sivion-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; }
    .sivion-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* ── Voice recorder waveform ─────────────────────── */
    .waveform-bar { display:inline-block; width:3px; background:#00a884; border-radius:99px; transition:height 0.08s ease; min-height:4px; }
    .waveform-bar.animate { animation: waveBar 0.6s ease-in-out infinite; }

    /* ── Message enter animation ─────────────────────── */
    .message-enter { animation: messageFade 180ms ease-out; }

    /* ── Contact item ────────────────────────────────── */
    .contact-item { border-radius: 14px; margin-bottom: 2px; transition: all 0.15s ease; }

    /* ── Glass morphism effect ───────────────────────── */
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.07); }

    /* ── Nav rail active state ───────────────────────── */
    .nav-rail-btn { transition: all 0.15s ease; }
    .nav-rail-btn.active { background: rgba(0,168,132,0.12); color: #00a884; border: 1px solid rgba(0,168,132,0.2); }

    /* ── Quick react on hover ────────────────────────── */
    .group:hover .quick-react { display: flex !important; }
    .quick-react button:hover { transform: scale(1.3); }

    /* ── Premium input focus glow ────────────────────── */
    input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(0,168,132,0.12); }

    /* ── Status indicators ───────────────────────────── */
    .status-online  { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .status-away    { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.4); }
    .status-busy    { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.4); }
    .status-offline { background: #475569; }

    /* ── Shimmer loading ─────────────────────────────── */
    .shimmer { background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

    /* ── Premium button active state ────────────────── */
    button:active { transform: scale(0.97); }
    button { transition: all 0.15s ease; }

    /* ── Settings nav active ─────────────────────────── */
    .settings-nav-btn { transition: all 0.15s ease; border-radius: 10px; }
    .settings-nav-btn.active { background: rgba(0,168,132,0.1); color: #00a884; }

    /* ── Composer textarea ───────────────────────────── */
    #composer-input { resize: none; field-sizing: content; }

    /* ── Message bubble ──────────────────────────────── */
    .msg-bubble { transition: opacity 0.15s; }

    /* ── Auth tab transition ─────────────────────────── */
    .auth-tab { transition: all 0.2s cubic-bezier(.4,0,.2,1); }

    /* ── Hide scrollbar (mobile) ─────────────────────── */
    @media (max-width: 768px) {
      ::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body class="bg-[#060d18] text-slate-100 overflow-hidden">
  <div id="app" class="h-screen"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
